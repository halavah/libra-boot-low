[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "libra-boot-low"
version = "1.3.2"
description = "Low-code generator: YAML + Jinja2 templates producing full-stack Spring Boot + Vue3 scaffolding (backend/frontend/SQL/HTTP tests)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "halavah" }]
keywords = ["low-code", "code-generator", "jinja2", "spring-boot", "vue3", "scaffolding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = ["PyYAML>=5.4", "Jinja2>=2.11"]

[project.scripts]
libra-boot-low = "generator:main"

[tool.setuptools]
py-modules = ["generator"]

[tool.setuptools.packages.find]
include = ["module*"]
