# =====================================================
# Master-detail-with-file 模式 — 主从表有附件
# =====================================================
# 适用场景: 1:N 主从关系 + 主表或明细表需要附件上传
#
# UI 交互特点:
#   - 主列表页展示主表数据，支持条件搜索（G-form-search）
#   - 点击主表某行 → isType 切换到明细页
#   - 明细页展示该主表记录下的所有明细数据（内嵌表格）
#   - 主表/明细的新增编辑页面可包含 el-upload 附件上传组件
#   - 返回按钮返回主列表页
#   - 页面切换模式，非弹窗模式
#
# 接口数量: 根据附件配置决定
#   主表有附件: 14 个（基础11 + upload/file-list/file-remove）
#   主表无附件: 11 个
#   明细有附件: 14 个（基础11 + upload/file-list/file-remove）
#   明细无附件: 11 个
#
# =====================================================
# YAML 字段填写说明（master-detail-with-file 模式）
# =====================================================
# project:
#   name: 项目中文名（用于文档与展示）
#   code: 项目编码（英文小写，如 demo）
#   version: 版本号（如 1.0.0）
#
# modules:
#   - name: 模块中文名
#     code: 模块组编码（如 t2004）
#     domain: 业务域编码（如 test）
#     mode: 固定填写 master-detail-with-file
#     description: 模块说明（可选）
#
#     master: [必填] 主表配置
#       code: 表编码（决定后端类名后缀，如 t2004proj）
#       name: 表中文名
#       status_toggles: [可选] 主表状态切换按钮配置
#       batch_operations: [可选] 主表批量操作配置
#       file_types: [可选] 主表附件类型配置（若不配置则不生成附件代码）
#       fields: [必填] 主表字段列表
#
#     detail: [必填] 明细表配置
#       code: 表编码（如 t2004projitem）
#       name: 表中文名
#       master_fk: [必填] 外键字段名，关联主表 id（如 projId）
#       status_toggles: [可选] 明细表状态切换按钮配置
#       batch_operations: [可选] 明细表批量操作配置
#       file_types: [可选] 明细表附件类型配置（若不配置则不生成附件代码）
#       fields: [必填] 明细表字段列表
#
# file_types 配置:
#   - code: 附件类型编码（英文小写，如 annex/photo）
#     label: 附件类型中文名
#
# status_toggles 配置:
#   - field: 状态字段名（如 status）
#     label: 中文标签
#     values: { "0": "禁用", "1": "启用" }
#     colors: { "0": "danger", "1": "success" }
#
# batch_operations 配置:
#   delete:
#     enabled: true  # 启用批量逻辑删除
#   update:
#     enabled: true
#     confirm_message: "确认批量更新选中的记录？"
#     fields:
#       - name: "title"
#         label: "标题"
#         type: "input"
#         required: false
#       - name: "year"
#         label: "年度"
#         type: "date-year"
#         required: false
#       - name: "status"
#         label: "状态"
#         type: "select"
#         required: false
#         options:
#           - label: "进行中"
#             value: 1
#           - label: "已完成"
#             value: 2
#       - name: "remark"
#         label: "备注"
#         type: "textarea"
#         required: false
#
# fields[*] 字段配置:
#   name: 字段英文名（camelCase）
#   label: 字段中文名
#   type: input/textarea/number/decimal/date/datetime/date-year/select
#   required: 是否必填（true/false）
#   filterable: 是否参与搜索（true/false）
#   show_in_list: 是否列表显示（true/false）
#   options: 仅 select 类型填写（label/value 列表）
# =====================================================

# =====================================================
# 测试配置 - t2004 主子表全部附件
# =====================================================
# 模式: master-detail-with-file
# 附件配置: 主表✓ 明细✓
# 接口数量: 28（主表 14 + 明细 14）
#   主表: list/detail/add/update/remove/export/toggle/physical-remove/batch-delete/batch-physical-delete/batch-update + upload/file-list/file-remove
#   明细: list/detail/add/update/remove/export/toggle/physical-remove/batch-delete/batch-physical-delete/batch-update + upload/file-list/file-remove
#
# 验证产物:
#   04-server/                                    # ← 扁平结构
#     ├── controller/TestT2004projController.java      # 主表 14 接口（含附件3接口）
#     ├── controller/TestT2004projitemController.java  # 明细 14 接口（含附件3接口）
#     ├── entity/po/BizTestT2004proj.java
#     ├── entity/po/BizTestT2004projFile.java          # 主表 FilePO
#     ├── entity/po/BizTestT2004projitem.java          # 含 projId 外键
#     ├── entity/po/BizTestT2004projitemFile.java      # 明细 FilePO
#     ├── entity/param/TestT2004projParam.java         # 含 fileList
#     ├── entity/param/TestT2004projBatchUpdateParam.java
#     ├── entity/param/TestT2004projFileParam.java
#     ├── entity/param/TestT2004projitemParam.java     # 含 fileList
#     ├── entity/param/TestT2004projitemBatchUpdateParam.java
#     ├── entity/param/TestT2004projitemFileParam.java
#     ├── entity/vo/TestT2004projVO.java               # 含 fileList
#     ├── entity/vo/TestT2004projFileVO.java
#     ├── entity/vo/TestT2004projitemVO.java           # 含 fileList
#     ├── entity/vo/TestT2004projitemFileVO.java
#     ├── mapper/TestT2004projMapper.java
#     ├── mapper/TestT2004projFileMapper.java
#     ├── mapper/TestT2004projitemMapper.java
#     ├── mapper/TestT2004projitemFileMapper.java
#     ├── mapper/xml/TestT2004projMapper.xml
#     ├── mapper/xml/TestT2004projFileMapper.xml
#     ├── mapper/xml/TestT2004projitemMapper.xml
#     ├── mapper/xml/TestT2004projitemFileMapper.xml
#     ├── service/ITestT2004projService.java
#     ├── service/ITestT2004projitemService.java
#     ├── service/impl/TestT2004projServiceImpl.java   # 含 MinIO
#     └── service/impl/TestT2004projitemServiceImpl.java  # 含 MinIO
#   05-web/
#     ├── views/test/t2004/index.vue
#     ├── views/test/t2004/t2004-t2004proj-add-or-edit.vue  # 含附件组件
#     └── service/test/t2004.js                       # 28 个 API 方法
#
# 命名规则: {DomainPascal}{CodePascal}*
#   主表: TestT2004proj* / 明细: TestT2004projitem*
# =====================================================

project:
  name: "Libra Boot Low"
  code: "demo"
  version: "1.0.0"

modules:
  - name: "主子表全部附件"
    code: "t2004"
    domain: "test"
    mode: "master-detail-with-file"
    description: "T04-3 测试模块 - 主子表全部有附件"

    master:
      code: "t2004proj"
      name: "项目主表"

      status_toggles:
        - field: "status"
          label: "状态"
          values:
            "0": "草稿"
            1: "进行中"
            2: "已完成"
          colors:
            "0": "info"
            1: "warning"
            2: "success"

      batch_operations:
        delete:
          enabled: true
        update:
          enabled: true
          confirm_message: "确认批量更新选中的主表记录？"
          fields:
            - name: "status"
              label: "状态"
              type: "select"
              required: false
              options:
                - label: "未开始"
                  value: 0
                - label: "进行中"
                  value: 1
                - label: "已完成"
                  value: 2
            - name: "remark"
              label: "备注"
              type: "textarea"
              required: false

      file_types:
        - code: "plan"
          label: "计划文件"
        - code: "report"
          label: "报告文件"
      fields:
        - name: "projectName"
          label: "项目名称"
          type: "input"
          required: true
          filterable: true
          show_in_list: true
        - name: "year"
          label: "年度"
          type: "date-year"
          required: true
          filterable: true
          show_in_list: true
        - name: "remark"
          label: "备注"
          type: "textarea"

    detail:
      code: "t2004projitem"
      name: "项目子项"
      master_fk: "projId"

      status_toggles:
        - field: "itemStatus"
          label: "子项状态"
          values:
            "0": "未开始"
            1: "进行中"
            2: "已完成"
          colors:
            "0": "info"
            1: "warning"
            2: "success"

      batch_operations:
        delete:
          enabled: true
        update:
          enabled: true
          confirm_message: "确认批量更新选中的明细记录？"
          fields:
            - name: "status"
              label: "状态"
              type: "select"
              required: false
              options:
                - label: "待处理"
                  value: 0
                - label: "处理中"
                  value: 1
                - label: "已完成"
                  value: 2
            - name: "remark"
              label: "备注"
              type: "textarea"
              required: false

      file_types:
        - code: "result"
          label: "成果文件"
        - code: "photo"
          label: "现场照片"
      fields:
        - name: "itemName"
          label: "子项名称"
          type: "input"
          required: true
          filterable: true
          show_in_list: true
        - name: "itemDate"
          label: "执行日期"
          type: "date"
          required: true
          show_in_list: true
        - name: "remark"
          label: "备注"
          type: "textarea"
