# =====================================================
# Master-details-tabs-dialog 模式 — Tab 弹窗无附件
# =====================================================
# 适用场景: 多明细表使用 el-tabs 切换，明细新增/编辑使用 el-dialog 弹窗
#
# UI 交互特点:
#   - 主列表页展示主表数据，支持条件搜索（G-form-search）
#   - 点击主表某行 → 展开显示 el-tabs 明细区域
#   - el-tabs 切换不同明细表（如：任务明细、记录明细）
#   - 每个 Tab 内展示对应明细表的列表数据
#   - 明细点击「新增」→ 弹出 el-dialog 新增表单
#   - 明细点击「编辑」→ 弹出 el-dialog 编辑表单
#   - 明细点击「删除」→ ElMessageBox 确认后删除
#   - 适用于明细数据较少、快速编辑场景
#   - 弹窗模式，非页面切换
#
# 接口数量: 主表 11 + N × 明细 11
#   主表: list / detail / add / update / remove / export
#         toggle / physical-remove / batch-delete / batch-physical-delete / batch-update
#   每个明细表: list / detail / add / update / remove / export
#               toggle / physical-remove / batch-delete / batch-physical-delete / batch-update
#
# =====================================================
# YAML 字段填写说明（master-details-tabs-dialog 模式）
# =====================================================
# project:
#   name: 项目中文名（用于文档与展示）
#   code: 项目编码（英文小写，如 demo）
#   version: 版本号（如 1.0.0）
#
# modules:
#   - name: 模块中文名
#     code: 模块组编码（如 t5000）
#     domain: 业务域编码（如 test）
#     mode: 固定填写 master-details-tabs-dialog
#     description: 模块说明（可选）
#
#     master: [必填] 主表配置
#       code: 表编码（决定后端类名后缀，如 t5000proj）
#       name: 表中文名
#       status_toggles: [可选] 主表状态切换按钮配置
#       batch_operations: [可选] 主表批量操作配置
#       fields: [必填] 主表字段列表
#
#     detail_modules: [必填] 明细表数组（支持 2+ 个明细表）
#       - code: 明细表编码（如 t5000task）
#         name: 明细表中文名
#         master_fk: [必填] 外键字段名，关联主表 id（如 projId）
#         status_toggles: [可选] 明细表状态切换按钮配置
#         batch_operations: [可选] 明细表批量操作配置
#         fields: [必填] 明细表字段列表
#
# UI 交互特点:
#   - 主列表页点击行进入 Tab 明细视图
#   - 明细的新增/编辑操作在 el-dialog 弹窗中完成
#   - 适用于明细数据较少、快速编辑场景
#
# status_toggles 配置:
#   - field: 状态字段名（如 status）
#     label: 中文标签
#     values: { "0": "禁用", "1": "启用" }
#     colors: { "0": "danger", "1": "success" }
#
# batch_operations 配置:
#   delete:
#     enabled: true  # 启用批量逻辑删除
#   update:
#     enabled: true
#     confirm_message: "确认批量更新选中的记录？"
#     fields:
#       - name: "title"
#         label: "标题"
#         type: "input"
#         required: false
#       - name: "year"
#         label: "年度"
#         type: "date-year"
#         required: false
#       - name: "status"
#         label: "状态"
#         type: "select"
#         required: false
#         options:
#           - label: "进行中"
#             value: 1
#           - label: "已完成"
#             value: 2
#       - name: "remark"
#         label: "备注"
#         type: "textarea"
#         required: false
#
# fields[*] 字段配置:
#   name: 字段英文名（camelCase）
#   label: 字段中文名
#   type: input/textarea/number/decimal/date/datetime/date-year/select
#   required: 是否必填（true/false）
#   filterable: 是否参与搜索（true/false）
#   show_in_list: 是否列表显示（true/false）
#   options: 仅 select 类型填写（label/value 列表）
# =====================================================

# =====================================================
# 测试配置 - t5000 Tab弹窗无附件
# =====================================================
# 模式: master-details-tabs-dialog
# 附件配置: 主表× 明细×
# 接口数量: 33（主表 11 + 明细1 11 + 明细2 11）
#   主表: list/detail/add/update/remove/export/toggle/physical-remove/batch-delete/batch-physical-delete/batch-update
#   明细: list/detail/add/update/remove/export/toggle/physical-remove/batch-delete/batch-physical-delete/batch-update
#
# 验证产物:
#   04-server/                                    # ← 扁平结构
#     ├── controller/TestT5000projController.java      # 主表 11 接口
#     ├── controller/TestT5000taskController.java      # 明细1 11 接口
#     ├── controller/TestT5000recordController.java    # 明细2 11 接口
#     ├── entity/po/BizTestT5000proj.java
#     ├── entity/po/BizTestT5000task.java              # 含 projId 外键
#     ├── entity/po/BizTestT5000record.java            # 含 projId 外键
#     ├── entity/param/*Param.java
#     ├── entity/vo/*VO.java
#     ├── mapper/*Mapper.java
#     ├── mapper/xml/*Mapper.xml
#     ├── service/I*Service.java
#     └── service/impl/*ServiceImpl.java              # 无 MinIO
#   05-web/
#     ├── views/test/t5000/index.vue                  # 主列表 + el-tabs + 弹窗编辑
#     ├── views/test/t5000/t5000-t5000proj-add-or-edit.vue
#     └── service/test/t5000.js                       # 33 个 API 方法
#
# 命名规则: {DomainPascal}{CodePascal}*
#   主表: TestT5000proj* / 明细1: TestT5000task* / 明细2: TestT5000record*
# =====================================================

project:
  name: "Libra Boot Low"
  code: "demo"
  version: "1.0.0"

modules:
  - name: "Tab弹窗无附件"
    code: "t5000"
    domain: "test"
    mode: "master-details-tabs-dialog"
    description: "T09 测试模块 - Tab弹窗无附件"

    master:
      code: "t5000proj"
      name: "项目主表"

      status_toggles:
        - field: "status"
          label: "状态"
          values:
            "0": "草稿"
            1: "进行中"
            2: "已完成"
          colors:
            "0": "info"
            1: "warning"
            2: "success"

      batch_operations:
        delete:
          enabled: true
        update:
          enabled: true
          confirm_message: "确认批量更新选中的主表记录？"
          fields:
            - name: "status"
              label: "状态"
              type: "select"
              required: false
              options:
                - label: "未开始"
                  value: 0
                - label: "进行中"
                  value: 1
                - label: "已完成"
                  value: 2
            - name: "remark"
              label: "备注"
              type: "textarea"
              required: false

      fields:
        - name: "projectName"
          label: "项目名称"
          type: "input"
          required: true
          filterable: true
          show_in_list: true
        - name: "year"
          label: "年度"
          type: "date-year"
          required: true
          filterable: true
          show_in_list: true
        - name: "status"
          label: "状态"
          type: "select"
          filterable: true
          show_in_list: true
          options:
            - label: "草稿"
              value: 0
            - label: "进行中"
              value: 1
            - label: "已完成"
              value: 2
        - name: "remark"
          label: "备注"
          type: "textarea"

    detail_modules:
      - code: "t5000task"
        name: "任务明细"
        master_fk: "projId"

        batch_operations:
          delete:
            enabled: true

        fields:
          - name: "taskName"
            label: "任务名称"
            type: "input"
            required: true
            filterable: true
            show_in_list: true
          - name: "taskDate"
            label: "任务日期"
            type: "date"
            required: true
            show_in_list: true
          - name: "status"
            label: "状态"
            type: "select"
            filterable: true
            show_in_list: true
            options:
              - label: "未开始"
                value: 0
              - label: "进行中"
                value: 1
              - label: "已完成"
                value: 2
          - name: "remark"
            label: "备注"
            type: "textarea"

      - code: "t5000record"
        name: "记录明细"
        master_fk: "projId"

        batch_operations:
          delete:
            enabled: true

        fields:
          - name: "recordTitle"
            label: "记录标题"
            type: "input"
            required: true
            filterable: true
            show_in_list: true
          - name: "recordDate"
            label: "记录日期"
            type: "date"
            required: true
            show_in_list: true
          - name: "content"
            label: "内容"
            type: "textarea"
