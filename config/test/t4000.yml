# =====================================================
# Master-details-tabs 模式 — Tab 明细无附件
# =====================================================
# 适用场景: 多明细表使用 el-tabs 切换，明细新增/编辑使用页面切换（isType 模式）
#
# UI 交互特点:
#   - 主列表页展示主表数据，支持条件搜索（G-form-search）
#   - 点击主表某行 → 展开显示 el-tabs 明细区域（不跳转页面）
#   - el-tabs 切换不同明细表（如：任务明细、记录明细）
#   - 每个 Tab 内展示对应明细表的列表数据
#   - 明细点击「新增」→ isType 切换到明细新增页面
#   - 明细点击「编辑」→ isType 切换到明细编辑页面
#   - 明细点击「详情」→ isType 切换到明细详情页面
#   - 页面切换模式，非弹窗模式
#
# 接口数量: 主表 11 + N × 明细 11
#   主表: list / detail / add / update / remove / export
#         toggle / physical-remove / batch-delete / batch-physical-delete / batch-update
#   每个明细表: list / detail / add / update / remove / export
#               toggle / physical-remove / batch-delete / batch-physical-delete / batch-update
#
# =====================================================
# YAML 字段填写说明（master-details-tabs 模式）
# =====================================================
# project:
#   name: 项目中文名（用于文档与展示）
#   code: 项目编码（英文小写，如 demo）
#   version: 版本号（如 1.0.0）
#
# modules:
#   - name: 模块中文名
#     code: 模块组编码（如 t4000）
#     domain: 业务域编码（如 test）
#     mode: 固定填写 master-details-tabs
#     description: 模块说明（可选）
#
#     master: [必填] 主表配置
#       code: 表编码（决定后端类名后缀，如 t4000proj）
#       name: 表中文名
#       status_toggles: [可选] 主表状态切换按钮配置
#       batch_operations: [可选] 主表批量操作配置
#       fields: [必填] 主表字段列表
#
#     detail_modules: [必填] 明细表数组（支持 2+ 个明细表）
#       - code: 明细表编码（如 t4000task）
#         name: 明细表中文名
#         master_fk: [必填] 外键字段名，关联主表 id（如 projId）
#         status_toggles: [可选] 明细表状态切换按钮配置
#         batch_operations: [可选] 明细表批量操作配置
#         fields: [必填] 明细表字段列表
#
# UI 交互特点:
#   - 主列表页点击行进入 Tab 明细视图
#   - 使用 el-tabs 组件切换不同明细表
#   - 明细的新增/编辑使用页面切换（isType 模式）
#
# status_toggles 配置:
#   - field: 状态字段名（如 status）
#     label: 中文标签
#     values: { "0": "禁用", "1": "启用" }
#     colors: { "0": "danger", "1": "success" }
#
# batch_operations 配置:
#   delete:
#     enabled: true  # 启用批量逻辑删除
#   update:
#     enabled: true
#     confirm_message: "确认批量更新选中的记录？"
#     fields:
#       - name: "title"
#         label: "标题"
#         type: "input"
#         required: false
#       - name: "year"
#         label: "年度"
#         type: "date-year"
#         required: false
#       - name: "status"
#         label: "状态"
#         type: "select"
#         required: false
#         options:
#           - label: "进行中"
#             value: 1
#           - label: "已完成"
#             value: 2
#       - name: "remark"
#         label: "备注"
#         type: "textarea"
#         required: false
#
# fields[*] 字段配置:
#   name: 字段英文名（camelCase）
#   label: 字段中文名
#   type: input/textarea/number/decimal/date/datetime/date-year/select
#   required: 是否必填（true/false）
#   filterable: 是否参与搜索（true/false）
#   show_in_list: 是否列表显示（true/false）
#   options: 仅 select 类型填写（label/value 列表）
# =====================================================

# =====================================================
# 测试配置 - t4000 Tab明细无附件
# =====================================================
# 模式: master-details-tabs
# 附件配置: 主表× 明细×
# 接口数量: 33（主表 11 + 明细1 11 + 明细2 11）
#   主表: list/detail/add/update/remove/export/toggle/physical-remove/batch-delete/batch-physical-delete/batch-update
#   明细: list/detail/add/update/remove/export/toggle/physical-remove/batch-delete/batch-physical-delete/batch-update
#
# 验证产物:
#   04-server/                                    # ← 扁平结构
#     ├── controller/TestT4000projController.java      # 主表 11 接口
#     ├── controller/TestT4000taskController.java      # 明细1 11 接口
#     ├── controller/TestT4000recordController.java    # 明细2 11 接口
#     ├── entity/po/BizTestT4000proj.java
#     ├── entity/po/BizTestT4000task.java              # 含 projId 外键
#     ├── entity/po/BizTestT4000record.java            # 含 projId 外键
#     ├── entity/param/TestT4000projParam.java
#     ├── entity/param/TestT4000projBatchUpdateParam.java
#     ├── entity/param/TestT4000taskParam.java
#     ├── entity/param/TestT4000taskBatchUpdateParam.java
#     ├── entity/param/TestT4000recordParam.java
#     ├── entity/param/TestT4000recordBatchUpdateParam.java
#     ├── entity/vo/TestT4000projVO.java
#     ├── entity/vo/TestT4000taskVO.java
#     ├── entity/vo/TestT4000recordVO.java
#     ├── mapper/TestT4000projMapper.java
#     ├── mapper/TestT4000taskMapper.java
#     ├── mapper/TestT4000recordMapper.java
#     ├── mapper/xml/TestT4000projMapper.xml
#     ├── mapper/xml/TestT4000taskMapper.xml
#     ├── mapper/xml/TestT4000recordMapper.xml
#     ├── service/ITestT4000projService.java
#     ├── service/ITestT4000taskService.java
#     ├── service/ITestT4000recordService.java
#     └── service/impl/*ServiceImpl.java              # 无 MinIO
#   05-web/
#     ├── views/test/t4000/index.vue                  # 主列表 + el-tabs 明细切换
#     ├── views/test/t4000/t4000-t4000proj-add-or-edit.vue
#     └── service/test/t4000.js                       # 33 个 API 方法
#
# 命名规则: {DomainPascal}{CodePascal}*
#   主表: TestT4000proj* / 明细1: TestT4000task* / 明细2: TestT4000record*
# =====================================================

project:
  name: "Libra Boot Low"
  code: "demo"
  version: "1.0.0"

modules:
  - name: "Tab明细无附件"
    code: "t4000"
    domain: "test"
    mode: "master-details-tabs"
    description: "T07 测试模块 - Tab明细无附件"

    master:
      code: "t4000proj"
      name: "项目主表"

      status_toggles:
        - field: "status"
          label: "状态"
          values:
            "0": "草稿"
            1: "进行中"
            2: "已完成"
          colors:
            "0": "info"
            1: "warning"
            2: "success"

      batch_operations:
        delete:
          enabled: true
        update:
          enabled: true
          confirm_message: "确认批量更新选中的主表记录？"
          fields:
            - name: "projectName"
              label: "项目名称"
              type: "input"
              required: false
            - name: "year"
              label: "年度"
              type: "date-year"
              required: false
            - name: "status"
              label: "状态"
              type: "select"
              required: false
              options:
                - label: "草稿"
                  value: 0
                - label: "进行中"
                  value: 1
                - label: "已完成"
                  value: 2
            - name: "remark"
              label: "备注"
              type: "textarea"
              required: false

      fields:
        - name: "projectName"
          label: "项目名称"
          type: "input"
          required: true
          filterable: true
          show_in_list: true
        - name: "year"
          label: "年度"
          type: "date-year"
          required: true
          filterable: true
          show_in_list: true
        - name: "status"
          label: "状态"
          type: "select"
          filterable: true
          show_in_list: true
          options:
            - label: "草稿"
              value: 0
            - label: "进行中"
              value: 1
            - label: "已完成"
              value: 2
        - name: "remark"
          label: "备注"
          type: "textarea"

    detail_modules:
      - code: "t4000task"
        name: "任务明细"
        master_fk: "projId"

        status_toggles:
          - field: "status"
            label: "任务状态"
            values:
              "0": "未开始"
              1: "进行中"
              2: "已完成"
            colors:
              "0": "info"
              1: "warning"
              2: "success"

        batch_operations:
          delete:
            enabled: true
          update:
            enabled: true
            confirm_message: "确认批量更新选中的任务记录？"
            fields:
              - name: "taskName"
                label: "任务名称"
                type: "input"
                required: false
              - name: "taskDate"
                label: "任务日期"
                type: "date"
                required: false
              - name: "status"
                label: "状态"
                type: "select"
                required: false
                options:
                  - label: "未开始"
                    value: 0
                  - label: "进行中"
                    value: 1
                  - label: "已完成"
                    value: 2
              - name: "remark"
                label: "备注"
                type: "textarea"
                required: false

        fields:
          - name: "taskName"
            label: "任务名称"
            type: "input"
            required: true
            filterable: true
            show_in_list: true
          - name: "taskDate"
            label: "任务日期"
            type: "date"
            required: true
            show_in_list: true
          - name: "status"
            label: "状态"
            type: "select"
            filterable: true
            show_in_list: true
            options:
              - label: "未开始"
                value: 0
              - label: "进行中"
                value: 1
              - label: "已完成"
                value: 2
          - name: "remark"
            label: "备注"
            type: "textarea"

      - code: "t4000record"
        name: "记录明细"
        master_fk: "projId"

        status_toggles:
          - field: "recordStatus"
            label: "记录状态"
            values:
              "0": "待审核"
              1: "已审核"
            colors:
              "0": "warning"
              1: "success"

        batch_operations:
          delete:
            enabled: true
          update:
            enabled: true
            confirm_message: "确认批量更新选中的记录？"
            fields:
              - name: "recordTitle"
                label: "记录标题"
                type: "input"
                required: false
              - name: "recordDate"
                label: "记录日期"
                type: "date"
                required: false
              - name: "recordStatus"
                label: "记录状态"
                type: "select"
                required: false
                options:
                  - label: "待审核"
                    value: 0
                  - label: "已审核"
                    value: 1
              - name: "content"
                label: "内容"
                type: "textarea"
                required: false

        fields:
          - name: "recordTitle"
            label: "记录标题"
            type: "input"
            required: true
            filterable: true
            show_in_list: true
          - name: "recordDate"
            label: "记录日期"
            type: "date"
            required: true
            show_in_list: true
          - name: "recordStatus"
            label: "记录状态"
            type: "select"
            filterable: true
            show_in_list: true
            options:
              - label: "待审核"
                value: 0
              - label: "已审核"
                value: 1
          - name: "content"
            label: "内容"
            type: "textarea"
